<!doctype html>
<html lang="pt-BR" translate="no" class="notranslate">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f7f9fc">
  <meta name="google" content="notranslate">
  <title>OdontoView Network</title>
  <style>
    html,body,#root{min-height:100%;margin:0}
    body{background:#f7f9fc;color:#0b1733;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    .boot{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}
    .boot strong{display:block;font-size:24px;color:#0d376f;margin-bottom:8px}
    .runtime-error{max-width:720px;margin:40px auto;background:#fff;border:1px solid #e5ebf4;border-radius:20px;padding:24px;white-space:pre-wrap;overflow-wrap:anywhere}
  </style>
</head>
<body translate="no" class="notranslate">
  <div id="root"></div>
  <div id="startup-fallback" class="boot"><div><strong>OdontoView</strong><span>Carregando Network…</span></div></div>
  <script>
    window.__ODONTOVIEW_STARTED__=false;
    function showStartupError(message){
      if(window.__ODONTOVIEW_STARTED__)return;
      var el=document.getElementById("startup-fallback");
      if(el) el.innerHTML='<div class="runtime-error"><strong>OdontoView — erro de inicialização</strong><br><br>'+String(message).replace(/[&<>"]/g,function(c){return({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"})[c]})+'</div>';
    }
    window.addEventListener("error",function(e){showStartupError(e.message||"Erro JavaScript não identificado.");});
    window.addEventListener("unhandledrejection",function(e){showStartupError((e.reason&&e.reason.message)||e.reason||"Falha ao iniciar a aplicação.");});
  </script>
  <script src="/viewer-libs/cornerstone.min.js"></script>
  <script src="/viewer-libs/dicomParser.min.js"></script>
  <script src="/viewer-libs/cornerstoneWADOImageLoaderNoWebWorkers.bundle.min.js"></script>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
