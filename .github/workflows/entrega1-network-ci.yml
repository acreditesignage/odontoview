name: Entrega 1 - OdontoView Network
on:
  push:
    branches: [feat/entrega-1-odonto-view-network]
  pull_request:
    branches: [main]
    paths: ["apps/api/**","apps/web/**",".github/workflows/entrega1-network-ci.yml"]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_USER: odontoview, POSTGRES_PASSWORD: odontoview, POSTGRES_DB: odontoview_test}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U odontoview"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://odontoview:odontoview@localhost:5432/odontoview_test?schema=public
      JWT_SECRET: ci-secret-only
      PATIENT_APP_URL: http://localhost:5173/paciente
      CORS_ORIGIN: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - name: API install
        working-directory: apps/api
        run: npm install
      - name: Prisma generate
        working-directory: apps/api
        run: npx prisma generate
      - name: Prepare database
        working-directory: apps/api
        run: npx prisma db push
      - name: API tests
        working-directory: apps/api
        run: npm test
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Web install
        working-directory: apps/web
        run: npm install
      - name: Web implant library tests
        working-directory: apps/web
        run: npm run test:implant-library
      - name: Web build
        working-directory: apps/web
        run: npm run build
      - name: Web Viewer2 desktop layout visual smoke
        working-directory: apps/web
        run: |
          set -euo pipefail
          mkdir -p dist/legacy-ingest/js dist/legacy-ingest/vendor/libarchive dist/viewer-libs
          cp ../../js/archive-import.js ../../js/archive-worker.js ../../js/archive-core.js ../../js/dicom-metadata.js dist/legacy-ingest/js/
          cp -R ../../vendor/libarchive/. dist/legacy-ingest/vendor/libarchive/
          cp node_modules/cornerstone-core/dist/cornerstone.min.js dist/viewer-libs/cornerstone.min.js
          cp node_modules/dicom-parser/dist/dicomParser.min.js dist/viewer-libs/dicomParser.min.js
          cp node_modules/cornerstone-wado-image-loader/dist/cornerstoneWADOImageLoaderNoWebWorkers.bundle.min.js dist/viewer-libs/cornerstoneWADOImageLoaderNoWebWorkers.bundle.min.js
          npx vite preview --host 127.0.0.1 --port 4173 >/tmp/odontoview-viewer2-layout-vite.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill "$PREVIEW_PID" 2>/dev/null || true' EXIT
          VIEWER2_LAYOUT_CDP_PORT=9224 node scripts/smoke-viewer2-layout.mjs
      - name: Upload Viewer2 desktop layout smoke screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: viewer2-layout-smoke
          path: apps/web/viewer2-layout-smoke/*
          if-no-files-found: warn
      - name: Web geometry lab visual smoke
        working-directory: apps/web
        run: |
          set -euo pipefail
          npx vite preview --host 127.0.0.1 --port 4173 >/tmp/odontoview-geometry-lab-vite.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill "$PREVIEW_PID" 2>/dev/null || true' EXIT
          node scripts/smoke-implant-geometry-lab.mjs
      - name: Upload geometry lab smoke screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: implant-geometry-lab-smoke
          path: apps/web/implant-geometry-lab-smoke/*.png
          if-no-files-found: warn
      - name: Web implant viewer geometry visual smoke
        working-directory: apps/web
        run: |
          set -euo pipefail
          npx vite preview --host 127.0.0.1 --port 4173 >/tmp/odontoview-implant-viewer-vite.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill "$PREVIEW_PID" 2>/dev/null || true' EXIT
          IMPLANT_VIEWER_CDP_PORT=9223 node scripts/smoke-implant-viewer-geometry.mjs
      - name: Upload implant viewer geometry smoke screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: implant-viewer-geometry-smoke
          path: apps/web/implant-viewer-geometry-smoke/*.png
          if-no-files-found: warn
